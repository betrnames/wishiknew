<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 400px; height: 400px; overflow: hidden; }
    body {
      width: 400px;
      height: 400px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 35% 30%, rgba(232, 168, 74, 0.18), transparent 42%),
        radial-gradient(circle at 70% 75%, rgba(80, 140, 150, 0.10), transparent 40%),
        #1c1c1f;
    }
    .mark {
      width: 168px;
      height: 168px;
      border-radius: 40px;
      background: #141416;
      border: 1.5px solid #333336;
      display: grid;
      place-items: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .mark svg {
      width: 88px;
      height: 88px;
      stroke: #e8a84a;
    }
  </style>
</head>
<body>
  <div class="mark" aria-hidden="true">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72" />
      <path d="m14 7 3 3" />
      <path d="M5 6v4" /><path d="M19 14v4" /><path d="M10 2v2" />
      <path d="M7 8H3" /><path d="M21 16h-4" /><path d="M11 3H9" />
    </svg>
  </div>
</body>
</html>
