<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 675px; overflow: hidden; }
    body {
      font-family: Outfit, system-ui, sans-serif;
      width: 1200px; height: 675px; color: #cfcfcf;
      background: radial-gradient(ellipse 60% 70% at 90% 10%, rgba(232, 168, 74, 0.22), transparent 55%), #1c1c1f;
      padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between;
      border: 1px solid #2e2e32;
    }
    .kicker { font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #e8a84a; }
    h1 { margin-top: 16px; font-size: 48px; font-weight: 800; letter-spacing: -0.04em; color: #f2f2f2; line-height: 1.08; }
    h1 span { color: #e8a84a; }
    .stats { display: flex; gap: 16px; margin-top: 28px; flex-wrap: wrap; }
    .stat { background: #141416; border: 1px solid #333336; border-radius: 16px; padding: 16px 20px; min-width: 160px; }
    .stat b { display: block; font-size: 26px; font-weight: 800; color: #f2f2f2; letter-spacing: -0.03em; }
    .stat span { font-size: 13px; color: #8a8a8e; font-weight: 500; }
    .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
    .pattern { font-size: 20px; font-weight: 600; color: #9a9a9e; }
    .pattern strong { color: #e8a84a; }
    .site { font-size: 18px; font-weight: 700; color: #ececec; }
  </style>
</head>
<body>
  <div>
    <div class="kicker">Wish I Knew · Case study</div>
    <h1>TrustMRR hit<br /><span>~$18k MRR in 5 days</span></h1>
    <div class="stats">
      <div class="stat"><b>$0 → $18k</b><span>MRR in 5 days</span></div>
      <div class="stat"><b>20/20</b><span>sponsor spots sold</span></div>
      <div class="stat"><b>Verified</b><span>real Stripe MRR</span></div>
    </div>
  </div>
  <div class="foot">
    <p class="pattern">Pattern: <strong>Sell scarce status on a public board</strong></p>
    <p class="site">wishiknew.lol/?l=trustmrr</p>
  </div>
</body>
</html>
