<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1500px; height: 500px; overflow: hidden; }
    body {
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      width: 1500px;
      height: 500px;
      background:
        radial-gradient(ellipse 50% 80% at 78% 30%, rgba(232, 168, 74, 0.18), transparent 60%),
        radial-gradient(ellipse 30% 55% at 15% 80%, rgba(80, 140, 150, 0.10), transparent 50%),
        linear-gradient(180deg, #1c1c1f 0%, #141416 100%);
      /* Clear X avatar (bottom-left) and edge crop */
      padding: 0 140px 0 300px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }
    .tag {
      font-size: 44px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.28;
      letter-spacing: -0.03em;
      max-width: 900px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
    }
  </style>
</head>
<body>
  <p class="tag">Indie launch patterns — steal the playbook, don’t clone the site.</p>
</body>
</html>
